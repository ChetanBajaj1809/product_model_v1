<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product Model Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0f14;--surface:#13161e;--surface2:#1a1e2a;--surface3:#222636;
    --border:#2a2f3f;--border2:#353c52;--accent:#4f7cff;--accent2:#7b5ea7;
    --accent3:#28c98f;--accent4:#f4a442;--danger:#ff4f6b;
    --text:#e4e8f5;--text2:#9aa3bc;--text3:#5c6480;
    --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:14px;height:56px;position:sticky;top:0;z-index:100;}
  .logo{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;}
  .logo span{color:var(--text3);}
  .back-btn{background:none;border:1px solid var(--border2);border-radius:5px;padding:5px 12px;color:var(--text2);font-size:11px;font-family:var(--sans);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;}
  .back-btn:hover{border-color:var(--accent);color:var(--accent);}
  .header-right{margin-left:auto;display:flex;gap:10px;align-items:center;}
  .change-badge{font-family:var(--mono);font-size:10px;color:var(--accent4);background:rgba(244,164,66,.1);border:1px solid rgba(244,164,66,.2);border-radius:4px;padding:2px 8px;}
  .dl-btn{background:var(--accent3);border:none;border-radius:6px;padding:7px 16px;color:#0d0f14;font-size:12px;font-weight:700;font-family:var(--sans);cursor:pointer;transition:opacity .15s;display:flex;align-items:center;gap:6px;}
  .dl-btn:hover{opacity:.88;}
  .dl-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* UPLOAD */
  #upload-screen{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;}
  .ucard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px;max-width:460px;width:100%;text-align:center;}
  .ucard h2{font-size:18px;font-weight:700;margin-bottom:8px;}
  .ucard p{color:var(--text3);font-size:13px;margin-bottom:24px;}
  .drop-zone{border:2px dashed var(--border2);border-radius:10px;padding:28px;cursor:pointer;transition:all .2s;position:relative;margin-bottom:14px;}
  .drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:rgba(79,124,255,.04);}
  .drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .dzt{color:var(--text2);font-size:13px;pointer-events:none;}
  .dzt strong{color:var(--accent);}
  .dzh{margin-top:5px;font-size:11px;color:var(--text3);font-family:var(--mono);pointer-events:none;}
  .fname{margin-bottom:12px;font-family:var(--mono);font-size:11px;color:var(--accent3);background:rgba(40,201,143,.08);border:1px solid rgba(40,201,143,.15);border-radius:5px;padding:5px 12px;display:none;}
  .load-btn{width:100%;background:var(--accent);border:none;border-radius:7px;padding:11px;color:#fff;font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer;}
  .load-btn:disabled{opacity:.4;cursor:not-allowed;}
  .lerr{margin-top:10px;font-size:12px;color:var(--danger);display:none;}

  /* EDITOR */
  #editor-screen{display:none;flex:1;flex-direction:column;overflow:hidden;height:calc(100vh - 56px);}

  .tab-bar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 24px;}
  .tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:13px 18px;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;transition:all .15s;white-space:nowrap;}
  .tab-btn:hover{color:var(--text2);}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tcnt{font-family:var(--mono);font-size:9px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:1px 6px;margin-left:5px;color:var(--text3);}

  .toolbar{padding:9px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface);flex-shrink:0;}
  .add-btn{background:none;border:1px solid var(--border2);border-radius:5px;padding:5px 12px;color:var(--accent3);font-size:11px;font-family:var(--sans);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;}
  .add-btn:hover{background:rgba(40,201,143,.07);border-color:var(--accent3);}
  .tsearch{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:5px 10px;color:var(--text);font-size:11px;font-family:var(--sans);outline:none;width:210px;}
  .tsearch:focus{border-color:var(--accent);}
  .tsearch::placeholder{color:var(--text3);}
  .rcnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text3);}

  .grid-wrap{flex:1;overflow:auto;}
  .grid-wrap::-webkit-scrollbar{width:5px;height:5px;}
  .grid-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

  table.grid{border-collapse:collapse;width:max-content;min-width:100%;}
  table.grid thead{position:sticky;top:0;z-index:5;}
  table.grid th{
    background:var(--surface2);border-right:1px solid var(--border);border-bottom:2px solid var(--border2);
    padding:7px 10px;font-family:var(--mono);font-size:9px;font-weight:600;text-transform:uppercase;
    letter-spacing:.07em;color:var(--text3);white-space:nowrap;text-align:left;
    min-width:130px;max-width:240px;user-select:none;
  }
  table.grid th.act-col{min-width:36px;max-width:36px;width:36px;}
  table.grid tbody tr:hover{background:rgba(255,255,255,.02);}
  table.grid tbody tr.modified{background:rgba(244,164,66,.04);}
  table.grid tbody tr.is-new{background:rgba(40,201,143,.04);}
  table.grid td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0;vertical-align:top;}
  table.grid td.act-col{text-align:center;padding:4px;vertical-align:middle;}

  textarea.ci{
    display:block;width:100%;background:transparent;border:none;outline:none;
    padding:6px 10px;font-size:12px;font-family:var(--sans);color:var(--text);
    resize:none;overflow:hidden;line-height:1.45;min-height:32px;
  }
  textarea.ci:focus{background:rgba(79,124,255,.07);box-shadow:inset 0 0 0 1px var(--accent);}
  textarea.ci.kc{font-family:var(--mono);font-size:10px;color:var(--accent3);}

  .del-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:3px 6px;border-radius:3px;font-size:12px;transition:all .15s;}
  .del-btn:hover{background:rgba(255,79,107,.12);color:var(--danger);}
</style>
</head>
<body>

<header>
  <button class="back-btn" id="back-btn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Explorer
  </button>
  <div class="logo">PM<span>/</span>Editor</div>
  <div class="header-right">
    <span class="change-badge" id="change-badge" style="display:none"></span>
    
    <span id="dl-note" style="display:none;font-family:var(--mono);font-size:10px;color:var(--text3)">You'll be prompted to re-select your file to download</span>
    <button class="dl-btn" id="dl-btn" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download Updated Excel
    </button>
  </div>
</header>

<div id="upload-screen">
  <div class="ucard">
    <h2>Load Product Model</h2>
    <p>Upload your Excel file to edit clauses, terms and options, then download the updated file.</p>
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".xlsx,.xls"/>
      <div class="dzt"><strong>Click to browse</strong> or drag & drop</div>
      <div class="dzh">.xlsx or .xls · max 20 MB</div>
    </div>
    <div class="fname" id="fname"></div>
    <button class="load-btn" id="load-btn" disabled>Load & Edit</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<div id="editor-screen">
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="clauses">Clauses - Small Business <span class="tcnt" id="cnt-clauses">0</span></button>
    <button class="tab-btn" data-tab="terms">Terms - Small Business <span class="tcnt" id="cnt-terms">0</span></button>
    <button class="tab-btn" data-tab="options">Options - Small Business <span class="tcnt" id="cnt-options">0</span></button>
    <button class="tab-btn" data-tab="rules">PM Business Rules <span class="tcnt" id="cnt-rules">0</span></button>
  </div>
  <div class="toolbar">
    <button class="add-btn" id="add-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Row
    </button>
    <input class="tsearch" id="tsearch" placeholder="Filter rows…" autocomplete="off"/>
    <span class="rcnt" id="rcnt"></span>
  </div>
  <div class="grid-wrap" id="grid-wrap"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let selectedFile = null;
let sheets = {};
let hdrs   = {};
let dirty  = { clauses: new Set(), terms: new Set(), options: new Set(), rules: new Set() };
let activeTab = 'clauses';
let filterQ   = '';

const KEY_COLS = {
  clauses: ['Clause code'],
  terms:   ['Term Code', 'Related Clause Code'],
  options: ['Related Clause Term Code', 'Term Code'],
  rules:   ['Business Rule Number'],
};

// ── On load: check sessionStorage for already-parsed data ──────────────────
window.addEventListener('DOMContentLoaded', () => {
  try {
    const stored = sessionStorage.getItem('pmRawSheets');
    if (stored) {
      const rawSheets = JSON.parse(stored);
      loadFromRaw(rawSheets);
      // Hide upload screen immediately - no file re-upload needed
      document.getElementById('upload-screen').style.display = 'none';
      document.getElementById('editor-screen').style.display = 'flex';
      document.getElementById('dl-btn').disabled = false;
      // Note: download still needs file, so show a subtle note
      document.getElementById('dl-note').style.display = 'block';
      return;
    }
  } catch(e) {}
  // No stored data — show upload screen as normal
});

function loadFromRaw(rawSheets) {
  sheets = {
    clauses: rawSheets.clauses  || [],
    terms:   rawSheets.terms    || [],
    options: rawSheets.options  || [],
    rules:   rawSheets.rules    || [],
  };
  hdrs = {
    clauses: rawSheets.clauseHeaders || [],
    terms:   rawSheets.termHeaders   || [],
    options: rawSheets.optionHeaders || [],
    rules:   rawSheets.ruleHeaders   || [],
  };
  updateCounts();
  renderGrid();
}

// ── Upload (fallback if no sessionStorage data) ──────────────────────────────
const fileInput = document.getElementById('file-input');
const dropZone  = document.getElementById('drop-zone');
const loadBtn   = document.getElementById('load-btn');
const fnameEl   = document.getElementById('fname');
const lerrEl    = document.getElementById('lerr');

function pickFile(f) {
  if (!f) return;
  selectedFile = f;
  fnameEl.textContent = '📄 ' + f.name;
  fnameEl.style.display = 'block';
  loadBtn.disabled = false;
  lerrEl.style.display = 'none';
}
fileInput.addEventListener('change', e => pickFile(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); pickFile(e.dataTransfer.files[0]); });

loadBtn.addEventListener('click', async () => {
  loadBtn.disabled = true;
  loadBtn.textContent = 'Parsing…';
  lerrEl.style.display = 'none';
  const fd = new FormData();
  fd.append('file', selectedFile);
  try {
    const res  = await fetch('/api/parse', { method: 'POST', body: fd });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Server error');
    if (!json.rawSheets) throw new Error('Server did not return raw sheet data.');
    try { sessionStorage.setItem('pmRawSheets', JSON.stringify(json.rawSheets)); } catch(e) {}
    loadFromRaw(json.rawSheets);
    document.getElementById('upload-screen').style.display = 'none';
    document.getElementById('editor-screen').style.display = 'flex';
    document.getElementById('dl-btn').disabled = false;
  } catch(e) {
    lerrEl.textContent = '⚠ ' + e.message;
    lerrEl.style.display = 'block';
    loadBtn.disabled = false;
    loadBtn.textContent = 'Load & Edit';
  }
});

// ── Tabs / toolbar ──────────────────────────────────────────────────────────
document.getElementById('back-btn').addEventListener('click', () => {
  if (totalDirty() > 0 && !confirm('You have unsaved changes. Leave anyway?')) return;
  window.location.href = '/';
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    filterQ = '';
    document.getElementById('tsearch').value = '';
    renderGrid();
  });
});

document.getElementById('tsearch').addEventListener('input', e => {
  filterQ = e.target.value.toLowerCase();
  renderGrid(true);
});

document.getElementById('add-btn').addEventListener('click', () => {
  const blank = {};
  hdrs[activeTab].forEach(h => blank[h] = '');
  sheets[activeTab].push(blank);
  dirty[activeTab].add(sheets[activeTab].length - 1);
  updateCounts();
  updateBadge();
  renderGrid();
  setTimeout(() => { document.getElementById('grid-wrap').scrollTop = 999999; }, 50);
});

// ── Grid ───────────────────────────────────────────────────────────────────
function renderGrid(filterOnly) {
  const tab  = activeTab;
  const rows = sheets[tab] || [];
  const cols = hdrs[tab]   || [];
  const kcs  = KEY_COLS[tab] || [];

  const visible = filterQ
    ? rows.map((r,i) => ({r,i})).filter(({r}) => Object.values(r).some(v => String(v).toLowerCase().includes(filterQ)))
    : rows.map((r,i) => ({r,i}));

  document.getElementById('rcnt').textContent = `${visible.length} / ${rows.length} rows`;

  if (!cols.length) {
    document.getElementById('grid-wrap').innerHTML = `<div style="padding:40px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text3)">No data available for this tab.</div>`;
    return;
  }

  let html = `<table class="grid"><thead><tr><th class="act-col"></th>`;
  cols.forEach(c => { html += `<th title="${esc(c)}">${esc(c)}</th>`; });
  html += `</tr></thead><tbody>`;

  visible.forEach(({r, i}) => {
    const isNew = dirty[tab].has(i) && cols.every(c => !r[c]);
    const cls   = isNew ? 'is-new' : dirty[tab].has(i) ? 'modified' : '';
    html += `<tr class="${cls}" data-idx="${i}"><td class="act-col"><button class="del-btn" onclick="delRow(${i})" title="Delete">✕</button></td>`;
    cols.forEach(c => {
      const isKey = kcs.includes(c);
      const v     = r[c] !== undefined ? String(r[c]) : '';
      html += `<td><textarea class="ci${isKey?' kc':''}" data-idx="${i}" data-col="${esc(c)}" oninput="cellEdit(this)">${escTA(v)}</textarea></td>`;
    });
    html += `</tr>`;
  });

  html += `</tbody></table>`;
  document.getElementById('grid-wrap').innerHTML = html;
  document.querySelectorAll('textarea.ci').forEach(fit);
}

function fit(ta) { ta.style.height = '0'; ta.style.height = ta.scrollHeight + 'px'; }

window.cellEdit = function(ta) {
  const idx = parseInt(ta.dataset.idx);
  const col = ta.dataset.col;
  sheets[activeTab][idx][col] = ta.value;
  dirty[activeTab].add(idx);
  const tr = ta.closest('tr');
  if (tr && !tr.classList.contains('is-new')) tr.classList.add('modified');
  fit(ta);
  updateBadge();
  // Keep sessionStorage in sync
  try { sessionStorage.setItem('pmRawSheets', JSON.stringify({ clauses: sheets.clauses, clauseHeaders: hdrs.clauses, terms: sheets.terms, termHeaders: hdrs.terms, options: sheets.options, optionHeaders: hdrs.options, rules: sheets.rules, ruleHeaders: hdrs.rules })); } catch(e) {}
};

window.delRow = function(idx) {
  if (!confirm('Delete this row?')) return;
  sheets[activeTab].splice(idx, 1);
  const nd = new Set();
  dirty[activeTab].forEach(i => { if (i < idx) nd.add(i); else if (i > idx) nd.add(i-1); });
  dirty[activeTab] = nd;
  updateCounts();
  updateBadge();
  renderGrid();
};

function updateCounts() {
  document.getElementById('cnt-clauses').textContent = (sheets.clauses || []).length;
  document.getElementById('cnt-terms').textContent   = (sheets.terms   || []).length;
  document.getElementById('cnt-options').textContent = (sheets.options  || []).length;
  document.getElementById('cnt-rules').textContent   = (sheets.rules   || []).length;
}

function totalDirty() { return Object.values(dirty).reduce((a, s) => a + s.size, 0); }

function updateBadge() {
  const n = totalDirty();
  const el = document.getElementById('change-badge');
  el.style.display = n > 0 ? 'inline-block' : 'none';
  if (n > 0) el.textContent = n + ' unsaved change' + (n !== 1 ? 's' : '');
}

// ── Download ───────────────────────────────────────────────────────────────
document.getElementById('dl-btn').addEventListener('click', async () => {
  // If we loaded from sessionStorage and have no file, prompt for it
  if (!selectedFile) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.xlsx,.xls';
    input.onchange = async e => { selectedFile = e.target.files[0]; await doDownload(); };
    input.click();
    return;
  }
  await doDownload();
});

async function doDownload() {
  const btn = document.getElementById('dl-btn');
  btn.disabled = true; btn.textContent = 'Generating…';
  const fd = new FormData();
  fd.append('file', selectedFile);
  fd.append('edits', JSON.stringify({ clauses: sheets.clauses, terms: sheets.terms, options: sheets.options, rules: sheets.rules }));
  try {
    const res = await fetch('/api/update', { method: 'POST', body: fd });
    if (!res.ok) { const j = await res.json(); throw new Error(j.error || 'Server error'); }
    const blob = await res.blob();
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'Product_Model_Updated.xlsx' });
    a.click(); URL.revokeObjectURL(a.href);
    dirty = { clauses: new Set(), terms: new Set(), options: new Set(), rules: new Set() };
    updateBadge();
  } catch(e) {
    alert('Failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download Updated Excel`;
  }
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escTA(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
